plugins {
    id "fabric-loom" version "1.17.14"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Only the public optional rendering adapter. Never private runtime jars.
    modCompileOnly "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"
    for (String library : ["org.json:json:20240303", "com.google.code.gson:gson:2.14.0",
                          "org.java-websocket:Java-WebSocket:1.6.0", "com.formdev:svgSalamander:1.1.4"]) {
        implementation library
        include library
    }
    compileOnly "org.jetbrains:annotations:26.0.2-1"
    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.ow2.asm:asm-tree:9.9.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

loom { accessWidenerPath = file("src/main/resources/spectra.accesswidener") }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = "UTF-8" }
processResources {
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") { expand("version": project.version) }
}
test { useJUnitPlatform() }
